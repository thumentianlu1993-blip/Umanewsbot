services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app/server
      - ./server/media:/app/server/media
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: /app/deploy/docker/start-worker.sh
    volumes:
      - ./server:/app/server
      - ./server/media:/app/server/media
      - ./runtime/race_result_review:/app/runtime/race_result_review:rw
    env_file:
      - .env
    environment:
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    depends_on:
      - db
      - redis

  race_live_worker:
    build: .
    command: /app/deploy/docker/start-race-live-worker.sh
    volumes:
      - ./server:/app/server
      - ./server/media:/app/server/media
      - ./runtime/secrets:/run/secrets:ro
      - ./runtime/race_live_racecards:/run/race-live/racecards:rw
      - ./runtime/race_live_publications:/run/race-live/publications:rw
    env_file:
      - .env
    environment:
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    depends_on:
      - db
      - redis

  race_sync_v2_worker:
    build: .
    command: /app/deploy/docker/start-race-data-sync-worker.sh
    volumes:
      - ./server:/app/server
      - ./runtime/secrets:/run/secrets:ro
      - ./runtime/race_data_sync:/run/race-data-sync:rw
    env_file:
      - .env
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A app beat -l info
    volumes:
      - ./server:/app/server
      - ./server/media:/app/server/media
      - ./runtime/race_result_review:/app/runtime/race_result_review:rw
    env_file:
      - .env
    environment:
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: horse_news
      POSTGRES_USER: horse_news
      POSTGRES_PASSWORD: horse_news
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
