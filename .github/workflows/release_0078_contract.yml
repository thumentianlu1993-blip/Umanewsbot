name: 0078 发布与恢复合同

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: '精确40位基线提交SHA；不自动执行基线全量'
        required: true
        type: string
      validation_scope:
        description: '本次验证范围；有界入口不表示全量通过'
        required: true
        default: known-failures
        type: choice
        options: [full, known-failures, toolchain]

      reason:
        description: 本次显式验证原因
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-contract:
    if: inputs.validation_scope == 'known-failures'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: release_0078_ci
          POSTGRES_USER: release_0078_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_0078_ci -d release_0078_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_ENGINE: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: release_0078_ci
      POSTGRES_USER: release_0078_ci
      POSTGRES_PASSWORD: synthetic-ci-only
      RELEASE_0078_TEST_POSTGRES: '1'
      DJANGO_SETTINGS_MODULE: app.settings
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装固定应用依赖与 PostgreSQL 16 客户端
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: 隔离测试（无生产配置、无外部业务请求）
        run: bash scripts/test_release_0078_contract.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-0078-test-evidence
          path: ${{ runner.temp }}/release-0078-test-evidence
          if-no-files-found: error

  impact-validation:
    if: inputs.validation_scope != 'known-failures'
    uses: ./.github/workflows/affected_tests.yml
    with:
      base_sha: ${{ inputs.baseline_sha }}
      candidate_sha: ${{ github.sha }}
      scope: ${{ inputs.validation_scope }}
      reason: ${{ inputs.reason }}

  bounded-regression:
    name: 已知失败相关回归 (${{ matrix.batch }})
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'known-failures'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: ['1', '2', '3', '4']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bounded_ci
          POSTGRES_USER: bounded_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bounded_ci -d bounded_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: bounded_ci
      POSTGRES_USER: bounded_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 验证有界入口并运行固定批次
        run: |
          python scripts/tests/test_bounded_stable_tests.py
          python scripts/run_bounded_stable_tests.py --batch '${{ matrix.batch }}' --output evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-${{ matrix.batch }}
          path: evidence
          if-no-files-found: error

  bounded-completeness:
    name: 有界回归完整性（不是全量测试）
    needs: [bounded-regression, release-contract]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'known-failures'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bounded-*
          path: evidence
      - name: 核对 SHA、四批完整集合、50项归宿及零跳过
        env:
          RELEASE_RESULT: ${{ needs.release-contract.result }}
          BOUNDED_RESULT: ${{ needs.bounded-regression.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$BOUNDED_RESULT" = success
          python scripts/verify_bounded_stable_evidence.py --root evidence --sha '${{ github.sha }}'
