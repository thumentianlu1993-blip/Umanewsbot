name: P0 合同归属说明
# PR 的唯一执行入口是 affected_tests，p0_bridge 清单见 catalog。
# 保留 workflow_call 便于旧调用方得到明确错误，避免无声遗漏合同。
on:
  workflow_call:
permissions:
  contents: read
jobs:
  moved:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '请使用 affected_tests 的 p0_bridge 领域；旧入口已停止。'
          exit 1
