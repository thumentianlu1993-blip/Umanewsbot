name: Research 2026 graded top-five Wikipedia mapping

on:
  pull_request:
    branches:
      - main
    paths:
      - runtime/research/collect_2026_graded_top5_wikipedia.py
      - .github/workflows/research_2026_graded_top5_wikipedia.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-2026-graded-top5-wikipedia-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 urllib3

      - name: Apply current public status-label compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("runtime/research/collect_2026_graded_top5_wikipedia.py")
          text = path.read_text(encoding="utf-8")
          old = 'if status != "已完赛":'
          new = 'if status not in {"已结束", "已完赛"}:'
          if old not in text:
              raise SystemExit("expected status-label guard not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile collector
        run: python -m py_compile runtime/research/collect_2026_graded_top5_wikipedia.py

      - name: Collect top-five finishers and Wikipedia mapping
        run: |
          python runtime/research/collect_2026_graded_top5_wikipedia.py \
            --base-url https://umafans.run \
            --cutoff 2026-07-26 \
            --delay 0.12 \
            --output-dir runtime/research/output/2026-graded-top5-wikipedia

      - name: Show summary
        if: always()
        run: |
          test -f runtime/research/output/2026-graded-top5-wikipedia/summary.json && cat runtime/research/output/2026-graded-top5-wikipedia/summary.json || true
          test -f runtime/research/output/2026-graded-top5-wikipedia/errors.json && cat runtime/research/output/2026-graded-top5-wikipedia/errors.json || true

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2026-graded-top5-wikipedia
          path: runtime/research/output/2026-graded-top5-wikipedia/
          if-no-files-found: error
          retention-days: 14
