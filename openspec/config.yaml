schema: spec-driven

context: |
  产品概述：
  Umanewsbot 是一个面向中文用户的日本赛马新闻平台。系统从 netkeiba
  和 JRA 采集文章，完成翻译与赛马术语纠偏，通过自动评分、AI 改写或
  人工编辑审核处理内容，发布到公开网站，并可通过 OneBot 向 QQ 群发送内容。

  运行环境与技术栈：
  - Python 3.12 与 Django 5.2 提供公开网站、运营后台、Django Admin、
    API 路由、数据模型和管理命令。
  - 前端使用 `server/stable/templates/` 中的 Django 模板与
    `server/stable/static/` 中的 CSS，不存在独立前端构建系统。
  - Celery Worker 与 Celery Beat 执行抓取、翻译、自动化、发布和通知任务，
    Redis 作为消息代理与结果后端。
  - 生产使用 PostgreSQL，本地检查与测试支持 SQLite。
  - Docker Compose 与 Nginx 提供生产运行环境，媒体存储支持本地磁盘与阿里云 OSS。

  架构与装配方式：
  - `server/manage.py` 是 Django 管理入口。
  - `server/app/settings.py` 管理环境变量配置，`server/app/urls.py`
    装配公开页面、后台、API 与健康检查路由，`server/app/celery.py` 配置 Celery。
  - `server/stable/models.py` 与 `server/stable/migrations/` 负责持久化。
  - `server/stable/views.py`、`urls.py`、`api_urls.py`、`forms.py`、
    `templates/` 与 `static/` 负责网页和运营后台。
  - `server/stable/tasks.py` 编排异步任务；领域逻辑与外部集成应放在
    `server/stable/services/` 与 `server/stable/adapters/`。
  - `Dockerfile`、`docker-compose*.yml`、`deploy/` 与根目录部署脚本负责
    打包、启动、部署、备份、回滚和 Nginx 配置。

  仓库约定：
  - 运行配置来自 `.env`，字段示例记录在 `.env.example`，由
    `server/app/settings.py` 读取。禁止提交 `.env` 或密钥。
  - Django 数据结构变化必须新增 `server/stable/migrations/` 下的迁移。
  - 长期项目状态和运维知识写入 `docs/`；状态文档冲突时以
    `docs/current_state.md` 为准。
  - 实施前必须阅读 `AGENTS.md` 和规定的启动文档。
  - 除非已批准的规格明确要求，否则保留 Django 单体与 Docker Compose 架构，
    不做无关重构。
  - 生产结论必须区分仓库预期与服务器真实 commit、环境变量、容器配置和日志。
  - 不手工修改生成的 `.codex/skills/openspec-*` 文件。
  - Codex 新增或维护的仓库文档、OpenSpec 产物和代理说明默认使用中文；
    仅保留命令、代码标识符以及工具要求的机器语法。

  构建、运行与测试命令：
  - 在仓库根目录安装依赖：
    pip install -r requirements.txt
  - 准备本地配置：
    cp .env.example .env
    本地开发设置 DB_ENGINE=sqlite 与 DEBUG=true。
  - 在 `server/` 下初始化并运行：
    python manage.py migrate
    python manage.py seed_admin --username admin --password admin123456
    python manage.py runserver
  - 在 `server/` 下执行标准检查：
    DB_ENGINE=sqlite python manage.py check
    DB_ENGINE=sqlite CELERY_TASK_ALWAYS_EAGER=true python manage.py test stable
  - 在仓库根目录验证 Compose：
    docker compose -f docker-compose.prod.yml config
    docker compose -f docker-compose.prod.lowcost.yml config
  - 冒烟检查：
    GET /healthz/ 必须返回 HTTP 200 和 {"status": "ok"}。
    运营后台登录入口为 `/admin/login/`；Django Admin 默认入口为 `/django-admin/`。

  工作领域：
  - application：Django 模型、迁移、视图、表单、路由、模板、静态资源、
    任务编排、管理命令和 stable 测试。
  - integration：来源适配器，以及抓取、翻译、改写、校验、OSS、通知和
    OneBot 等服务层集成。
  - operations：Dockerfile、Compose、部署脚本、Nginx、环境配置文档、
    部署运行手册和运维检查。

rules:
  tasks:
    - "每项任务必须使用领域前缀：(application)、(integration) 或 (operations)。"
    - "任务顺序必须先实施，后验证。"
    - "(application) 负责 server/app/、server/stable/models.py、migrations/、views.py、forms.py、urls.py、api_urls.py、templates/、static/、tasks.py、management/commands/ 和 server/stable/tests.py。"
    - "(integration) 负责 server/stable/adapters/ 和 server/stable/services/ 下的外部集成与领域服务工作。"
    - "(operations) 负责 Dockerfile、docker-compose*.yml、deploy*.sh、deploy/、.env.example 文档和 docs/ 下的部署运维文档。"
