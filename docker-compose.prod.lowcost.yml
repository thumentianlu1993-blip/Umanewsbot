services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: umanewsbot:prod
    command: /app/deploy/docker/start-web.sh
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MULTIREGION_ATTRIBUTION_MODE: ${MULTIREGION_ATTRIBUTION_MODE:-off}
      MULTIREGION_RELATED_REGION_QUERIES_ENABLED: ${MULTIREGION_RELATED_REGION_QUERIES_ENABLED:-false}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL:-150}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION:-10}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION:-20}
      MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN: ${MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN:-0.50}
      TRANSLATION_AUTO_RETRY_ENABLED: ${TRANSLATION_AUTO_RETRY_ENABLED:-false}
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    volumes:
      - static_data:/app/server/staticfiles
      - media_data:/app/server/media
      - app_logs:/app/logs
      - ./runtime/horse_profile_completion:/app/runtime/horse_profile_completion:rw
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker:
    image: umanewsbot:prod
    command: /app/deploy/docker/start-worker.sh
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MULTIREGION_ATTRIBUTION_MODE: ${MULTIREGION_ATTRIBUTION_MODE:-off}
      MULTIREGION_RELATED_REGION_QUERIES_ENABLED: ${MULTIREGION_RELATED_REGION_QUERIES_ENABLED:-false}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL:-150}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION:-10}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION:-20}
      MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN: ${MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN:-0.50}
      TRANSLATION_AUTO_RETRY_ENABLED: ${TRANSLATION_AUTO_RETRY_ENABLED:-false}
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    volumes:
      - media_data:/app/server/media
      - app_logs:/app/logs
      - race_result_review_data:/app/runtime/race_result_review
      - ./runtime/horse_profile_completion:/app/runtime/horse_profile_completion:rw
      - ./runtime/upcoming_racecard_urls:/app/runtime/upcoming_racecard_urls:rw
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  race_live_worker:
    image: umanewsbot:prod
    command: /app/deploy/docker/start-race-live-worker.sh
    cpus: ${RACE_LIVE_WORKER_CPUS:-0.25}
    mem_limit: ${RACE_LIVE_WORKER_MEMORY_LIMIT:-384M}
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MULTIREGION_ATTRIBUTION_MODE: ${MULTIREGION_ATTRIBUTION_MODE:-off}
      MULTIREGION_RELATED_REGION_QUERIES_ENABLED: ${MULTIREGION_RELATED_REGION_QUERIES_ENABLED:-false}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL:-150}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION:-10}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION:-20}
      MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN: ${MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN:-0.50}
      TRANSLATION_AUTO_RETRY_ENABLED: ${TRANSLATION_AUTO_RETRY_ENABLED:-false}
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    volumes:
      - media_data:/app/server/media
      - app_logs:/app/logs
      - ./runtime/secrets:/run/secrets:ro
      - ./runtime/race_live_racecards:/run/race-live/racecards:rw
      - ./runtime/race_live_publications:/run/race-live/publications:rw
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  beat:
    image: umanewsbot:prod
    command: /app/deploy/docker/start-beat.sh
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MULTIREGION_ATTRIBUTION_MODE: ${MULTIREGION_ATTRIBUTION_MODE:-off}
      MULTIREGION_RELATED_REGION_QUERIES_ENABLED: ${MULTIREGION_RELATED_REGION_QUERIES_ENABLED:-false}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_TOTAL:-150}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_PER_REGION:-10}
      MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION: ${MULTIREGION_ATTRIBUTION_GOLD_MIN_CROSS_REGION:-20}
      MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN: ${MULTIREGION_ATTRIBUTION_RELATED_RECALL_MIN:-0.50}
      TRANSLATION_AUTO_RETRY_ENABLED: ${TRANSLATION_AUTO_RETRY_ENABLED:-false}
      RACE_LIVE_SCHEDULER_ENABLED: ${RACE_LIVE_SCHEDULER_ENABLED:-false}
      RACE_LIVE_MONITOR_ENABLED: ${RACE_LIVE_MONITOR_ENABLED:-false}
      RACE_LIVE_ENABLED_REGIONS: ${RACE_LIVE_ENABLED_REGIONS:-}
      RACE_LIVE_TRA_REGISTRY_FILE: ${RACE_LIVE_TRA_REGISTRY_FILE:-/app/runtime/policies/race_live/source_registry_the_racing_api_free.json}
      RACE_LIVE_TRA_REGISTRY_SHA256: ${RACE_LIVE_TRA_REGISTRY_SHA256:-7aca49ff1df7573ebfe6a9e403eefca5c9e64d8ee18d8d3be383d67803db550a}
    volumes:
      - app_logs:/app/logs
      - race_result_review_data:/app/runtime/race_result_review
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horse_news}
      POSTGRES_USER: ${POSTGRES_USER:-horse_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horse_news}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horse_news} -d ${POSTGRES_DB:-horse_news}"]
      interval: 15s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  onebot:
    image: your-onebot-image:latest
    profiles: ["with-onebot"]
    restart: unless-stopped
    environment:
      ONEBOT_HTTP_ENABLE: "true"
      ONEBOT_HTTP_PORT: "3000"
      ONEBOT_HTTP_HOST: "0.0.0.0"
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./data:/opt/umanewsbot/data:ro
      - app_logs:/var/log/umanewsbot:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  app_logs:
  race_result_review_data:
