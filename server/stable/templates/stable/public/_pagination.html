<nav class="pagination" aria-label="分页">
  {% if page_obj.has_previous %}
    <a href="{% if public_previous_url %}{{ public_previous_url }}{% else %}?{% if pagination_querystring %}{{ pagination_querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}{% endif %}">上一页</a>
  {% endif %}
  <span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>
  {% if page_obj.has_next %}
    <a href="{% if public_next_url %}{{ public_next_url }}{% else %}?{% if pagination_querystring %}{{ pagination_querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}{% endif %}">下一页</a>
  {% endif %}
</nav>
